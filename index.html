<body>

  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>

  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-cl" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-cr" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-cd" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 4H6l4-4z"/><path d="M12 14v7"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-9 9"/></symbol>

</svg>

<div class="app" id="app">
  <aside class="side" id="side" aria-label="Lists and views"></aside>
  <div class="scrim" data-act="closeside"></div>
  <main class="main">
    <header class="top">
      <button class="topbtn" id="menuBtn" data-act="openside" aria-label="Open menu"><svg class="i"><use href="#i-menu"/></svg></button>
      <div class="titles"><h2 id="topTitle">Tasks</h2><div class="sub" id="topSub">All Lists</div></div>
      <button class="topbtn" id="searchBtn" data-act="togglesearch" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
      <label class="search" id="searchBox"><svg class="i sm"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search tasks and notes" autocomplete="off" aria-label="Search tasks and notes"><button class="clear" data-act="clearsearch" aria-label="Clear search" type="button"><svg class="i sm"><use href="#i-x"/></svg></button></label>
      <button class="topbtn" id="sortBtn" data-act="cyclesort" aria-label="Change sort order" title="Sort"><svg class="i"><use href="#i-sort"/></svg></button>
      <button class="topbtn" data-act="quicktheme" id="themeBtn" aria-label="Switch light or dark"><svg class="i"><use href="#i-moon"/></svg></button>
    </header>
    <div class="content" id="content">
      <div class="wrap" id="wrap"><div id="vhead" style="display:contents"></div><div id="vbody" style="display:contents"></div></div>
    </div>
    <nav class="bnav" id="bnav" aria-label="Main">
      <button data-act="view" data-id="tasks"><span class="pill"><svg class="i"><use href="#i-done"/></svg></span>Tasks</button>
      <button data-act="view" data-id="calendar"><span class="pill"><svg class="i"><use href="#i-cal"/></svg></span>Calendar</button>
      <button data-act="view" data-id="notes"><span class="pill"><svg class="i"><use href="#i-note"/></svg></span>Notes</button>
      <button data-act="view" data-id="progress"><span class="pill"><svg class="i"><use href="#i-chart"/></svg></span>Progress</button>
      <button data-act="view" data-id="prefs"><span class="pill"><svg class="i"><use href="#i-sliders"/></svg></span>Settings</button>
    </nav>
  </main>
  <button class="fab" id="fab" data-act="fab" aria-label="Add new task"><svg class="i"><use href="#i-plus"/></svg></button>
  <div class="auth" id="auth"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/storage.js"></script>
<script src="js/sync.js"></script>
<script src="js/actions.js"></script>
<script src="js/auth.js"></script>
<script src="js/quick-add.js"></script>
<script src="js/reminders.js"></script>
<script src="js/dictation.js"></script>
<script src="js/toasts.js"></script>
<script src="js/theme.js"></script>
<script src="js/derived.js"></script>
<script src="js/render.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/backup.js"></script>
<script src="js/router.js"></script>
<script src="js/events.js"></script>
<script src="js/main.js"></script>
<script>
  // Offline support and install as an app when hosted on a website (ignored inside Claude)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
